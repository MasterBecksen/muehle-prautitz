name: Projektordner aufraeumen
on:
  push:
    paths: ['.github/workflows/cleanup.yml']
permissions:
  contents: write
  actions: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dateien ins Hauptverzeichnis verschieben
        run: |
          set -e
          git mv muehle-upload/website/* .
          git rm -rq muehle-upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Projektdateien ins Hauptverzeichnis verschoben"
          git push
      - name: Vorschau und Bild-Import starten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run import-images.yml --ref main
          sleep 5
          gh workflow run pages.yml --ref main
